services:
  nagios:
    build: ./nagios
    image: hmd621/nagios-core:4.5.14
    container_name: nagios
    restart: unless-stopped
    # Host networking: SNMP requests leave the host with its own address (10.7.99.103),
    # and Apache sees the real client addresses.
    network_mode: host
    env_file: .env
    volumes:
      - ../nagios/conf.d:/usr/local/nagios/etc/conf.d:ro
      - ./certs:/certs
      - nagios-var:/usr/local/nagios/var

volumes:
  nagios-var:
