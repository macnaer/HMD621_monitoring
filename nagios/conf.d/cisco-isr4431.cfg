define host {
    name                    cisco-router
    use                     generic-host
    check_command           check-host-alive
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    notifications_enabled   0
    contact_groups          admins
    register                0
}

define host {
    use                     cisco-router
    host_name               isr4431-r1
    alias                   Cisco ISR4431 (phase 1)
    address                 10.7.0.101
}

define service {
    use                     generic-service
    host_name               isr4431-r1
    service_description     Uptime
    check_command           check_snmp_uptime
    check_interval          5
    notifications_enabled   0
}

define service {
    use                     generic-service
    host_name               isr4431-r1
    service_description     Memory
    check_command           check_cisco_mem!85!95
    check_interval          5
    notifications_enabled   0
}

define service {
    use                     generic-service
    host_name               isr4431-r1
