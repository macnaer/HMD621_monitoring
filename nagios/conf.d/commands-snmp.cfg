define command {
    command_name    check_snmp_uptime
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o .1.3.6.1.2.1.1.3.0
}

define command {
    command_name    check_cisco_mem
    command_line    $USER1$/check_cisco_mem.sh $HOSTADDRESS$ $USER5$ $ARG1$ $ARG2$
}

define command {
    command_name    check_snmp_cpu
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o .1.3.6.1.4.1.9.9.109.1.1.1.1.8.7 -w $ARG1$ -c $ARG2$
}

define command {
    command_name    check_snmp_ifoper
    command_line    $USER1$/check_snmp -H $HOSTADDRESS$ -P 2c -C $USER5$ -o .1.3.6.1.2.1.2.2.1.8.$ARG1$ -w 1:1 -c 1:1
}
